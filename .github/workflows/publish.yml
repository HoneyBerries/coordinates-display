name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up gradlew
        run: chmod +x ./gradlew

      - name: Read version and Modrinth project ID
        id: info
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          PROJECT_ID=$(grep '^project_id_modrinth' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already on Modrinth
        id: modrinth_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.info.outputs.version }}
          PROJECT_ID: ${{ steps.info.outputs.project_id }}
        run: |
          # Authenticated so it also works while the project is still under review.
          COUNT=$(curl -sf -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID/version" \
            | jq --arg v "$VERSION" '[.[] | select(.version_number == $v)] | length')
          echo "Found $COUNT existing Modrinth version(s) named $VERSION"
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to Modrinth and CurseForge
        if: steps.modrinth_check.outputs.exists == 'false'
        run: ./gradlew build publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Skip notice
        if: steps.modrinth_check.outputs.exists == 'true'
        run: echo "Version ${{ steps.info.outputs.version }} already published, skipping."
