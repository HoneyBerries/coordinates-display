modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description='''${description}'''
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "boxlib"
type = "incompatible"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
reason = "CoordinatesDisplay++ bundles BoxLib; remove the standalone BoxLib mod."

[[mixins]]
   config = "coordinatesdisplay.mixins.json"

[[mixins]]
   config = "boxlib.mixins.json"

[[mixins]]
   config = "boxlib-common.mixins.json"
